<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Runner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="menubar">
        <h2><u>Maze Runner</u></h2>
        <button class="startbtn">Start</button>
        <select id="difficulty">
            <option value="easy">Easy (10x10)</option>
            <option value="medium">Medium (20x20)</option>
            <option value="hard">Hard (30x30)</option>
        </select>
    </div>

    <main class="game-container">
        <canvas id="mazeCanvas"></canvas>

        <section id="controls">
            <div id="buttonFlex">
                <button id="btnUp" aria-label="Move Up">▲</button>
                <div class="buttonRow">
                    <button id="btnLeft" aria-label="Move Left">◀</button>
                    <button id="btnDown" aria-label="Move Down">▼</button>
                    <button id="btnRight" aria-label="Move Right">▶</button>
                </div>
            </div>
        </section>
    </main>

    <div class="msgbox"></div>

    <script src="script.js"></script>
</body>

</html>
